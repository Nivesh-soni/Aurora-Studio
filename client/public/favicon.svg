<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 100 100">
  <defs>
    <!-- Border Gradient (Image ke hisab se purple se cyan/blue) -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="75%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Aapke Logo ke Original Gradients -->
    <linearGradient id="g1" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="g2" x1="30%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc" />
      <stop offset="45%" stop-color="#7c3aed" />
      <stop offset="80%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Box aur Gradient Border -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="#090710" stroke="url(#borderGrad)" stroke-width="3.5" />

  <!-- Box ke andar bada aur centered 'A' Logo -->
  <g transform="translate(18, 18) scale(0.64)">
    <path d="M 12 88 C 9 88, 9 84, 11 79 L 36 22 C 41 13, 46 11, 53 11 L 59 24 L 34 80 C 30 86, 25 88, 17 88 Z" fill="url(#g1)" />
    <path d="M 45 13 C 51 11, 61 11, 67 22 L 89 79 C 91 84, 90 88, 86 88 C 78 88, 72 84, 64 76 L 56 68 L 64 61 L 52 24 C 49 17, 47 14, 45 13 Z" fill="url(#g2)" />
    <path d="M 45 43 C 45 40, 48 39, 50 40 L 63 48 C 65 49, 65 52, 63 53 L 50 61 C 48 62, 45 61, 45 58 Z" fill="url(#g3)" />
  </g>
</svg>
